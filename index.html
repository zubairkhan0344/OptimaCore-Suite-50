<!doctype html>

    <script>
      // Prevent "Cannot set property fetch of #<Window> which has only a getter" error inside wrapped sandbox environments
      (function() {
        try {
          const originalFetch = window.fetch || globalThis.fetch;
          let customFetch = undefined;

          const getFetch = function() {
            return customFetch || originalFetch;
          };
          const setFetch = function(v) {
            customFetch = v;
          };

          // 1. Redefine on Window.prototype if possible (where native fetch often resides)
          try {
            Object.defineProperty(Window.prototype, 'fetch', {
              get: getFetch,
              set: setFetch,
              configurable: true,
              enumerable: true
            });
          } catch (e) {}

          // 2. Redefine on window directly to intercept window.fetch assignments
          try {
            Object.defineProperty(window, 'fetch', {
              get: getFetch,
              set: setFetch,
              configurable: true,
              enumerable: true
            });
          } catch (e) {}

          // 3. Redefine on globalThis directly to intercept globalThis.fetch assignments
          if (typeof globalThis !== 'undefined' && globalThis !== window) {
            try {
              Object.defineProperty(globalThis, 'fetch', {
                get: getFetch,
                set: setFetch,
                configurable: true,
                enumerable: true
              });
            } catch (e) {}
          }
        } catch (e) {}
      })();
    </script>
