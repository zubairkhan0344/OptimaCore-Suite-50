    <script>
      // Prevent "Cannot set property fetch of #<Window> which has only a getter" error inside wrapped sandbox environments
      (function() {
        try {
          const nativeFetch = window.fetch || globalThis.fetch;
          if (nativeFetch) {
            Object.defineProperty(window, 'fetch', {
              value: nativeFetch,
              writable: true,
              configurable: true,
              enumerable: true
            });
            if (typeof globalThis !== 'undefined' && globalThis !== window) {
              Object.defineProperty(globalThis, 'fetch', {
                value: nativeFetch,
                writable: true,
                configurable: true,
                enumerable: true
              });
            }
          }
        } catch (e) {
          try {
            let activeFetch = window.fetch || globalThis.fetch;
            const descriptor = {
              get() { return activeFetch; },
              set(v) { activeFetch = v; },
              configurable: true,
              enumerable: true
            };
            Object.defineProperty(window, 'fetch', descriptor);
            if (typeof globalThis !== 'undefined' && globalThis !== window) {
              Object.defineProperty(globalThis, 'fetch', descriptor);
            }
          } catch (err) {
            // Fallback silently if environment strictly blocks redefining
          }
        }
      })();
    </script>
